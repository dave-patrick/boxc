<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Tile -->
    <radialGradient id="iconBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e2025" />
      <stop offset="100%" stop-color="#121316" />
    </radialGradient>

    <!-- Backlight Glow for Tray/Favicon contrast -->
    <filter id="iconBacklight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.23
        0 0 0 0 0.65
        0 0 0 0 0.95
        0 0 0 0.55 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Satin Charcoal Face Gradient -->
    <linearGradient id="iconXFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#383d44" />
      <stop offset="100%" stop-color="#202327" />
    </linearGradient>
  </defs>

  <!-- Rounded Base Plate (Transparent if using without background) -->
  <rect width="256" height="256" rx="48" fill="url(#iconBg)" />

  <!-- Selection Marquee Frame -->
  <rect x="36" y="36" width="184" height="184" fill="none" stroke="#454b54" stroke-width="5" stroke-dasharray="12 10" />

  <!-- Corner Handles -->
  <rect x="27" y="27" width="18" height="18" fill="#717a85" rx="3" />
  <rect x="211" y="27" width="18" height="18" fill="#717a85" rx="3" />
  <rect x="27" y="211" width="18" height="18" fill="#717a85" rx="3" />
  <rect x="211" y="211" width="18" height="18" fill="#717a85" rx="3" />

  <!-- Midpoint Handles -->
  <rect x="119" y="27" width="18" height="18" fill="#586069" rx="3" />
  <rect x="119" y="211" width="18" height="18" fill="#586069" rx="3" />
  <rect x="27" y="119" width="18" height="18" fill="#586069" rx="3" />
  <rect x="211" y="119" width="18" height="18" fill="#586069" rx="3" />

  <!-- Backlight Silhouette -->
  <path d="M 64,56 L 98,56 L 128,104 L 158,56 L 192,56 L 148,128 L 194,200 L 160,200 L 128,148 L 96,200 L 62,200 L 108,128 Z" fill="#389fe0" filter="url(#iconBacklight)" opacity="0.5" />

  <!-- Main 'X' Glyph with White Perimeter Outline -->
  <path d="M 64,56 L 98,56 L 128,104 L 158,56 L 192,56 L 148,128 L 194,200 L 160,200 L 128,148 L 96,200 L 62,200 L 108,128 Z" fill="url(#iconXFace)" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" />

  <!-- Center Optical Capture Reticle -->
  <rect x="115" y="115" width="26" height="26" rx="3" fill="#2678aa" stroke="#ffffff" stroke-width="2" />
</svg>