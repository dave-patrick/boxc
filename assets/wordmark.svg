<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <defs>
    <!-- Dark Background -->
    <rect id="bg" width="960" height="500" fill="#18191c" />

    <!-- Subtle Blue Backlight behind X -->
    <radialGradient id="backlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b96d2" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#3b96d2" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3b96d2" stop-opacity="0" />
    </radialGradient>
  </defs>

  

  <g id="wordmark">
    <!-- Letter 'b' (Ascender to baseline: 90 to 310) -->
    <path d="M 166,90 
             L 194,90 
             L 194,182 
             C 207,173 223,168 242,168 
             C 282,168 314,200 314,240 
             C 314,280 282,312 242,312 
             C 223,312 207,307 194,298 
             L 194,310 
             L 166,310 Z 
             M 194,240 
             C 194,266 214,286 240,286 
             C 266,286 286,266 286,240 
             C 286,214 266,194 240,194 
             C 214,194 194,214 194,240 Z" fill="#3b8ec4" />

    <!-- Letter 'o' (Shared x-height: 170 to 310) -->
    <path d="M 402,168 
             C 442,168 474,200 474,240 
             C 474,280 442,312 402,312 
             C 362,312 330,280 330,240 
             C 330,200 362,168 402,168 Z 
             M 402,194 
             C 376,194 358,214 358,240 
             C 358,266 376,286 402,286 
             C 428,286 446,266 446,240 
             C 446,214 428,194 402,194 Z" fill="#3b8ec4" />

    <!-- Bounding Selection Frame around 'x' -->
    <g id="selection-box">
      <!-- Glow behind X center -->
      <circle cx="562" cy="240" r="85" fill="url(#backlight)" />

      <!-- Dashed Marquee Rectangle -->
      <rect x="480" y="152" width="164" height="176" fill="none" stroke="#3a3f47" stroke-width="2" stroke-dasharray="8 6" />

      <!-- 4 Corner Handles -->
      <rect x="474" y="146" width="12" height="12" fill="#4d535c" />
      <rect x="638" y="146" width="12" height="12" fill="#4d535c" />
      <rect x="474" y="322" width="12" height="12" fill="#4d535c" />
      <rect x="638" y="322" width="12" height="12" fill="#4d535c" />

      <!-- 4 Edge Midpoint Handles -->
      <rect x="556" y="146" width="12" height="12" fill="#444a52" />
      <rect x="556" y="322" width="12" height="12" fill="#444a52" />
      <rect x="474" y="234" width="12" height="12" fill="#444a52" />
      <rect x="638" y="234" width="12" height="12" fill="#444a52" />

      <!-- Letter 'x' (Charcoal body with sharp white border) -->
      <path d="M 503,170 
               L 535,170 
               L 562,213 
               L 589,170 
               L 621,170 
               L 580,237 
               L 623,310 
               L 591,310 
               L 562,263 
               L 533,310 
               L 501,310 
               L 544,237 Z" fill="#32353a" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />

      <!-- Center Optical Focus Reticle -->
      <rect x="550" y="228" width="24" height="24" rx="4" fill="#18191c" stroke="#3a3f47" stroke-width="2" />
    </g>

    <!-- Letter 'c' (Shared x-height: 170 to 310) -->
    <path d="M 788,206 
             L 762,218 
             C 755,203 740,194 722,194 
             C 696,194 678,214 678,240 
             C 678,266 696,286 722,286 
             C 740,286 755,277 762,262 
             L 788,274 
             C 776,298 751,312 722,312 
             C 682,312 650,280 650,240 
             C 650,200 682,168 722,168 
             C 751,168 776,182 788,206 Z" fill="#3b8ec4" />
  </g>

  <!-- Tagline Subtitle -->
  <text x="480" y="396" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="23" font-weight="600" letter-spacing="0.32em" fill="#8a929b" text-anchor="middle">SCREEN TEXT GRABBER</text>
</svg>
